<!DOCTYPE html>
<html lang="en" xmlns:Nombre="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Formulario</title>
</head>
<body>
    <h1>Formulario de reserva de salas</h1>
    <div style="background-color: gray; border-top: 2px solid black;">
        <label for="nombre"> Tu nombre:<span style="color: red">*</span></label>
        <input style="margin-left: 129px" type="text" id="nombre" name="nombre" value="nombre">
    </div>
    <div style="border-top: 2px solid black;">
        <label for="correo">Tu correo electronico:<span style="color: red">*</span></label>
        <input style="margin-left: 60px" type="email" id="correo" name="correo electronico" value="correo electronico">
    </div>
    <div style="background-color: gray; border-top: 2px solid black;:">
        <label for="departamentos">Departamento:<span style="color: red">*</span></label>
        <select style="margin-left: 108px" id="departamentos" name="opciones">
            <option value="opcion1">Ventas</option>
            <option value="opcion2">Compras</option>
            <option value="opcion3">Ventas</option>
            <option value="opcion4">Compras</option>
        </select>

    </div>
    <div style="border-top: 2px solid black">
        <p>Tipo de sala que desea reservar:<span style="color: red">*</span> </p>

        <div style="text-align: right; padding-right: 10px; display: inline-block; margin-left: 200px">
        <input  type="radio" id="radio" name="nombre" value="Tipo A">
        <label for="radio">Tipo A<br></label>
        <input  type="radio" id="radios" name="nombre" value="Tipo B">
        <label for="radios">Tipo B<br></label>
        <input  type="radio" id="radioes" name="nombre" value="Tipo C">
        <label for="radioes">Tipo C</label>
        </div>

    </div>
    <div style="background-color: gray; border-top: 2px solid black;:">
        <p>Requisitos extra:</p>
        <div style=" padding-right: 10px; display: inline-block; margin-left: 200px">
        <input  type="checkbox" id="check" name="nombre" value="Caballete y boligrafos">
        <label for="check">Caballete y boligrafos<br></label>
        <input type="checkbox" id="checks" name="nombre" value="Television">
        <label for="checks">Television<br></label>
        <input type="checkbox" id="checkss" name="nombre" value="Cafe, te, agua">
        <label for="checkss">Cafe, Te, agua</label>
        </div>
    </div>
    <div style="border-top: 2px solid black">
        <label for="fecha">Fecha de la reserva:<span style="color: red">*</span></label>
        <input style="margin-left: 60px" type="date" id="fecha" name="nombre">
    </div>
    <div style="border-top: 2px solid black; background-color: gray; border-bottom: 2px solid black">
        <label for="hora">Fecha de la reserva:<span style="color: red">*</span></label>
        <input style="margin-left: 60px" type="time" id="hora" name="nombre">
    </div>
</body>
</html>
